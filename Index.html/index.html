<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Ingresos y Egresos</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="./appLogic.js"></script>
</head>
<body>
  <header>
    <h1>Gestión de Ingresos y Egresos</h1>
  </header>
  <main>
    <section id="form-section">
      <h2>Agregar Movimiento</h2>
      <form id="transaction-form">
        <label for="date">Fecha:</label>
        <input type="date" id="date" required>
        
        <label for="concept">Concepto:</label>
        <input type="text" id="concept" required>
        
        <label for="value">Valor:</label>
        <input type="number" id="value" required>
        
        <label for="type">Tipo:</label>
        <select id="type" required>
          <option value="ingreso">Ingreso</option>
          <option value="egreso">Egreso</option>
        </select>
        
        <button type="submit">Agregar</button>
      </form>
    </section>

    <section id="table-section">
      <h2>Movimientos</h2>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Ingreso</th>
            <th>Egreso</th>
          </tr>
        </thead>
        <tbody id="transaction-table"></tbody>
      </table>
    </section>

    <section id="totals-section">
      <h2>Resumen</h2>
      <p>Total Ingresos: <span id="total-ingresos">0</span></p>
      <p>Total Egresos: <span id="total-egresos">0</span></p>
      <p>Utilidad: <span id="utilidad">0</span></p>
    </section>
  </main>
</body>
</html>
